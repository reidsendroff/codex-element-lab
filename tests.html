<!doctype html><html lang="en"><meta charset="utf-8"><title>Element Lab local checks</title><style>body{background:#101721;color:#e9edf4;font:14px system-ui;padding:20px}iframe{border:1px solid #777;width:1200px;height:900px;max-width:100%}.pass{color:#b2f4d5}.fail{color:#ff997a}</style><h1>Element Lab local checks</h1><p>Self-contained simulation and interface checks. Reload to run again.</p><div id="results"></div><iframe id="app" src="index.html" title="App under test"></iframe><script src="simulation.js"></script><script src="tests.js"></script><script>
const report=document.querySelector('#results');let failures=0;
function result(name,pass,error=''){const p=document.createElement('p');p.className=pass?'pass':'fail';p.textContent=(pass?'PASS: ':'FAIL: ')+name+' '+error;report.append(p);if(!pass)failures++;}
simulationTestResults.forEach(r=>result(r.name,r.pass,r.error||''));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.querySelector('iframe').addEventListener('load',async()=>{
 try{
 const frame=document.querySelector('iframe'),win=frame.contentWindow,doc=win.document,c=doc.querySelector('canvas');
 const count=()=>Number(doc.querySelector('#particle-count').textContent.replace(/\D/g,''));
 result('Page initializes with example particles',count()>0 && c.width===240);
 doc.querySelector('#pause').click();result('Pause control updates state',doc.querySelector('#pause').textContent.includes('Resume'));
 doc.querySelector('#clear').click();result('Clear empties simulation',count()===0);
 for(const button of doc.querySelectorAll('[data-material]')){
 button.click();result('Select '+button.querySelectorAll('span')[1].firstChild.textContent,button.getAttribute('aria-pressed')==='true'&&doc.querySelectorAll('[aria-pressed=true]').length===1);
 if(button.dataset.material==='0')continue;
 const rect=c.getBoundingClientRect();const x=rect.left+rect.width*.5,y=rect.top+rect.height*.3;
 // Synthetic pointers do not hold native capture; use keyboard painting to test each UI material.
 c.focus();c.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
 result('Brush adds material '+button.dataset.material,count()>0);doc.querySelector('#clear').click();
 }
 doc.querySelector('[data-material="1"]').click();c.focus();c.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
 const pixels=()=>c.getContext('2d').getImageData(0,0,240,150).data.join();const before=pixels();await wait(150);result('Pause freezes sand',pixels()===before);
 doc.querySelector('#pause').click();await wait(180);result('Resume advances sand',pixels()!==before);
 doc.querySelector('#pause').click();doc.querySelector('#clear').click();await wait(80);result('Clear stays empty',count()===0);
 frame.style.width='375px';await wait(100);
 result('375px layout has no horizontal overflow',doc.documentElement.scrollWidth<=375);
 result('All narrow controls remain within viewport width',[...doc.querySelectorAll('button,input')].every(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.left>=0&&r.right<=375;}));
 result('Canvas prevents touch scrolling',win.getComputedStyle(c).touchAction==='none');
 }catch(e){result('Browser interface suite',false,e.message);}
 document.body.dataset.result=failures?'FAIL':'PASS';result('COMPLETE',!failures);
});
</script></html>
